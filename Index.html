<!DOCTYPE <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCC Attendance System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
        }

        header {
            background-color: #1b365d;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin-bottom: 15px;
            color: #1b365d;
            font-size: 1.2rem;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
            cursor: pointer;
        }

        .btn {
            background-color: #1b365d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #0f2341;
        }

        .btn-export {
            background-color: #27ae60;
            margin-bottom: 15px;
            width: auto;
            padding: 8px 15px;
            float: right;
        }

        .btn-export:hover {
            background-color: #1e8449;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table th, table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 0.9rem;
        }

        table th {
            background-color: #f8f9fa;
            color: #1b365d;
        }

        table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-yes {
            background-color: #ffeaa7;
            color: #d63031;
        }

        .badge-no {
            background-color: #e3fcef;
            color: #00b894;
        }
    </style>
</head>
<body>

    <header>
        <h1>NCC Attendance Portal</h1>
    </header>

    <div class="container">
        <!-- Form Section -->
        <div class="card">
            <h2>Add Attendance Record</h2>
            <form id="attendanceForm">
                <div class="form-group">
                    <label for="workerName">Worker Name</label>
                    <input type="text" id="workerName" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label for="attDate">Date</label>
                    <input type="date" id="attDate" required>
                </div>

                <div class="form-group">
                    <label for="inTime">In Time</label>
                    <input type="time" id="inTime" required>
                </div>

                <div class="form-group">
                    <label for="outTime">Out Time</label>
                    <input type="time" id="outTime" required>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="noLunch">
                    <label for="noLunch">No Lunch Taken</label>
                </div>

                <div class="form-group">
                    <label for="jobDetails">Job Details</label>
                    <textarea id="jobDetails" rows="3" placeholder="Enter work/job details..."></textarea>
                </div>

                <button type="submit" class="btn">Save Attendance</button>
            </form>
        </div>

        <!-- Table Section -->
        <div class="card">
            <h2>
                Attendance Records
                <button class="btn btn-export" onclick="exportToCSV()">Export Excel (CSV)</button>
            </h2>
            <div style="clear: both;"></div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Worker Name</th>
                            <th>In Time</th>
                            <th>Out Time</th>
                            <th>No Lunch</th>
                            <th>Job Details</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <!-- Data will load here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Set today's date by default
        document.getElementById('attDate').valueAsDate = new Date();

        // LocalStorage se data load karein
        let attendanceData = JSON.parse(localStorage.getItem('ncc_attendance')) || [];

        // Form Submit Handle Karein
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const record = {
                id: Date.now(),
                workerName: document.getElementById('workerName').value,
                date: document.getElementById('attDate').value,
                inTime: document.getElementById('inTime').value,
                outTime: document.getElementById('outTime').value,
                noLunch: document.getElementById('noLunch').checked,
                jobDetails: document.getElementById('jobDetails').value || '-'
            };

            attendanceData.push(record);
            localStorage.setItem('ncc_attendance', JSON.stringify(attendanceData));
            
            this.reset();
            document.getElementById('attDate').valueAsDate = new Date();
            renderTable();
        });

        // Table Data Render Karein
        function renderTable() {
            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = '';

            if (attendanceData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No records found</td></tr>';
                return;
            }

            // Latest data upar dikhane ke liye reverse sort
            [...attendanceData].reverse().forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.date}</td>
                    <td><strong>${item.workerName}</strong></td>
                    <td>${item.inTime}</td>
                    <td>${item.outTime}</td>
                    <td><span class="badge ${item.noLunch ? 'badge-yes' : 'badge-no'}">${item.noLunch ? 'Yes' : 'No'}</span></td>
                    <td>${item.jobDetails}</td>
                    <td><button class="btn-delete" onclick="deleteRecord(${item.id})">Delete</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Record Delete Karein
        function deleteRecord(id) {
            if(confirm('Kya aap is record ko delete karna chahte hain?')) {
                attendanceData = attendanceData.filter(item => item.id !== id);
                localStorage.setItem('ncc_attendance', JSON.stringify(attendanceData));
                renderTable();
            }
        }

        // Excel/CSV Download Functionality
        function exportToCSV() {
            if (attendanceData.length === 0) {
                alert('Export karne ke liye koi data nahi hai!');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Date,Worker Name,In Time,Out Time,No Lunch,Job Details\n";

            attendanceData.forEach(item => {
                let row = `"${item.date}","${item.workerName}","${item.inTime}","${item.outTime}","${item.noLunch ? 'Yes' : 'No'}","${item.jobDetails.replace(/"/g, '""')}"`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `NCC_Attendance_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initial Load
        renderTable();
    </script>
</body>
</html>
